<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Quality Predictor — M3 Expressive</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <style>
    :root {
      
      --md-sys-color-primary: #006874;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #97f0ff;
      --md-sys-color-on-primary-container: #001f25;
      --md-sys-color-surface: #f4fafb;
      --md-sys-color-surface-container: #e6f0f2;
      --md-sys-color-surface-container-high: #dbe4e6;
      --md-sys-color-on-surface: #161d1e;
      --md-sys-color-outline: #6f797a;
      
      --md-shape-corner-extra-large: 28px;
      --md-shape-corner-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
    }

    
    header {
      margin-bottom: 32px;
      text-align: center;
    }

    header .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-radius: var(--md-shape-corner-full);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Card Wrapper */
    .m3-card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-extra-large);
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      position: relative;
      overflow: hidden;
    }

    /* Progress Bar */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--md-sys-color-outline);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
      margin-bottom: 32px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--md-sys-color-primary);
      border-radius: var(--md-shape-corner-full);
      transition: width 0.3s ease;
    }

    /* Step Container */
    .step-content {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .input-label {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: block;
    }

    .input-subtext {
      font-size: 0.875rem;
      color: var(--md-sys-color-outline);
      margin-bottom: 20px;
    }

    .m3-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.25rem;
      font-weight: 600;
      border: 2px solid var(--md-sys-color-surface-container-high);
      background-color: var(--md-sys-color-surface);
      border-radius: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .m3-input:focus {
      border-color: var(--md-sys-color-primary);
    }

    /* Button Group */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .m3-button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: var(--md-shape-corner-full);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .m3-button:active {
      transform: scale(0.98);
    }

    .m3-button-secondary {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }

    .m3-button-primary {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .m3-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Result View */
    .result-card {
      display: none;
      text-align: center;
      padding: 20px 10px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .result-pill {
      display: inline-block;
      padding: 12px 28px;
      border-radius: var(--md-shape-corner-full);
      font-size: 2rem;
      font-weight: 800;
      margin: 20px 0;
      letter-spacing: -0.5px;
    }

    /* AQI Category Colors */
    .cat-Good { background-color: #c8e6c9; color: #1b5e20; }
    .cat-Satisfactory { background-color: #dcedc8; color: #33691e; }
    .cat-Moderate { background-color: #fff9c4; color: #f57f17; }
    .cat-Poor { background-color: #ffe0b2; color: #e65100; }
    .cat-Very-Poor { background-color: #ffccbc; color: #bf360c; }
    .cat-Severe { background-color: #f8bbd0; color: #880e4f; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="badge">
      <span class="material-symbols-outlined" style="font-size: 18px;">air</span>
      AQI Predictor
    </div>
    <h1>Environmental Metrics</h1>
  </header>

  <div class="m3-card" id="wizardCard">
    <div class="progress-header">
      <span id="stepIndicator">Step 1 of 19</span>
      <span id="percentIndicator">5%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="step-content">
      <label class="input-label" id="fieldLabel">PM2.5</label>
      <div class="input-subtext" id="fieldUnit">Concentration in µg/m³</div>
      <input type="number" step="any" id="fieldInput" class="m3-input" placeholder="Enter value..." autofocus>
    </div>

    <div class="button-group">
      <button class="m3-button m3-button-secondary" id="prevBtn" onclick="navigate(-1)" disabled>
        <span class="material-symbols-outlined">arrow_back</span> Back
      </button>
      <button class="m3-button m3-button-primary" id="nextBtn" onclick="navigate(1)">
        Next <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
  </div>

  <!-- Result Card -->
  <div class="m3-card result-card" id="resultCard">
    <span class="material-symbols-outlined" style="font-size: 48px; color: var(--md-sys-color-primary);">analytics</span>
    <h2 style="margin-top: 10px; font-weight: 700;">Predicted Air Quality</h2>
    
    <div id="resultText" class="result-pill cat-Good">Good</div>
    
    <p style="color: var(--md-sys-color-outline); margin-bottom: 24px;" id="resultDesc">
      Air quality is satisfactory, and air pollution poses little or no risk.
    </p>

    <button class="m3-button m3-button-primary" style="margin: 0 auto; max-width: 200px;" onclick="resetWizard()">
      <span class="material-symbols-outlined">restart_alt</span> Start Over
    </button>
  </div>
</div>

<script>
  const fields = [
    { key: "PM2.5", label: "PM2.5", unit: "Fine Particulate Matter (µg/m³)" },
    { key: "NO2", label: "NO2", unit: "Nitrogen Dioxide (µg/m³)" },
    { key: "NOx", label: "NOx", unit: "Nitrogen Oxides (ppb)" },
    { key: "NH3", label: "NH3", unit: "Ammonia (µg/m³)" },
    { key: "SO2", label: "SO2", unit: "Sulfur Dioxide (µg/m³)" },
    { key: "CO", label: "CO", unit: "Carbon Monoxide (mg/m³)" },
    { key: "Ozone", label: "Ozone", unit: "Ozone Level (µg/m³)" },
    { key: "Benzene", label: "Benzene", unit: "Benzene Level (µg/m³)" },
    { key: "Toluene", label: "Toluene", unit: "Toluene Level (µg/m³)" },
    { key: "Xylene", label: "Xylene", unit: "Xylene Concentration (µg/m³)" },
    { key: "MP-Xylene", label: "MP-Xylene", unit: "MP-Xylene Concentration (µg/m³)" },
    { key: "AT", label: "Ambient Temperature (AT)", unit: "Temperature (°C)" },
    { key: "RH", label: "Relative Humidity (RH)", unit: "Percentage (%)" },
    { key: "WS", label: "Wind Speed (WS)", unit: "Speed (m/s)" },
    { key: "WD", label: "Wind Direction (WD)", unit: "Degrees (°)" },
    { key: "SR", label: "Solar Radiation (SR)", unit: "Solar Irradiance (W/mt²)" },
    { key: "BP", label: "Barometric Pressure (BP)", unit: "Pressure (mmHg)" },
    { key: "VWS", label: "Vertical Wind Speed (VWS)", unit: "Speed (m/s)" },
    { key: "Month", label: "Month", unit: "Numeric Month (1 - 12)" }
  ];

  let currentStep = 0;
  const formData = {};

  const fieldLabel = document.getElementById('fieldLabel');
  const fieldUnit = document.getElementById('fieldUnit');
  const fieldInput = document.getElementById('fieldInput');
  const stepIndicator = document.getElementById('stepIndicator');
  const percentIndicator = document.getElementById('percentIndicator');
  const progressFill = document.getElementById('progressFill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function updateStep() {
    const field = fields[currentStep];
    fieldLabel.innerText = field.label;
    fieldUnit.innerText = field.unit;
    fieldInput.value = formData[field.key] || "";
    fieldInput.focus();

    const progressPct = Math.round(((currentStep + 1) / fields.length) * 100);
    stepIndicator.innerText = `Step ${currentStep + 1} of ${fields.length}`;
    percentIndicator.innerText = `${progressPct}%`;
    progressFill.style.width = `${progressPct}%`;

    prevBtn.disabled = currentStep === 0;
    
    if (currentStep === fields.length - 1) {
      nextBtn.innerHTML = `Predict <span class="material-symbols-outlined">auto_awesome</span>`;
    } else {
      nextBtn.innerHTML = `Next <span class="material-symbols-outlined">arrow_forward</span>`;
    }
  }

  function navigate(direction) {
    formData[fields[currentStep].key] = fieldInput.value;

    if (direction === 1 && currentStep === fields.length - 1) {
      processPrediction();
      return;
    }

    currentStep += direction;
    updateStep();
  }

  // Handle Enter keypress for fluid UX
  fieldInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') navigate(1);
  });

  

   async function processPrediction() {
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = true;
  nextBtn.innerHTML = `Predicting... <span class="material-symbols-outlined">hourglass_empty</span>`;

  try {
    const response = await fetch('http://127.0.0.1:5000/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });

    const data = await response.json();

    if (response.ok && data.category) {
      // Hide input wizard and reveal result card ONLY on success
      document.getElementById('wizardCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';
      displayResult(data.category);
    } else {
      alert(`Prediction Failed: ${data.error || 'Server error'}`);
    }
  } catch (error) {
    console.error("API Error:", error);
    alert("Could not connect to backend server. Make sure app.py is running.");
  } finally {
    nextBtn.disabled = false;
    nextBtn.innerHTML = `Predict <span class="material-symbols-outlined">auto_awesome</span>`;
  }
}

  function displayResult(category) {
    const resultText = document.getElementById('resultText');
    const resultDesc = document.getElementById('resultDesc');
    
    const descriptions = {
      "Good": "Minimal impact on health.",
      "Satisfactory": "Minor breathing discomfort to sensitive people.",
      "Moderate": "Breathing discomfort to people with lungs, asthma, and heart diseases.",
      "Poor": "Breathing discomfort to most people on prolonged exposure.",
      "Very Poor": "Respiratory illness on prolonged exposure.",
      "Severe": "Affects healthy people and seriously impacts those with existing diseases."
    };

    resultText.innerText = category;
    resultText.className = `result-pill cat-${category.replace(' ', '-')}`;
    resultDesc.innerText = descriptions[category] || "";
  }

  function resetWizard() {
    currentStep = 0;
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('wizardCard').style.display = 'block';
    updateStep();
  }

  // Initialize
  updateStep();
</script>

</body>
</html>
